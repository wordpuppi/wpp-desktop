# STANDALONE Cargo project — deliberately NOT a member of source/Cargo.toml
# so Tauri never compiles against the Loco/axum backend stack. The empty
# [workspace] table below detaches this nested crate from source/Cargo.toml
# WITHOUT adding it to that workspace's members.
[workspace]

[package]
name = "wordpuppi-desktop"
version = "0.1.50"
edition = "2021"
rust-version = "1.77"

[lib]
name = "wordpuppi_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-deep-link = "2"
tauri-plugin-updater = "2"
tauri-plugin-store = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-opener = "2"
tauri-plugin-http = "2"
portable-pty = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Dev-only Dock icon (set_dev_dock_icon): unbundled `cargo run` / `tauri dev`
# binaries have no .app to take an icon from. Same crates+features tao already
# pulls in, so this adds nothing to the build.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSApplication", "NSImage"] }
objc2-foundation = { version = "0.3", features = ["NSString"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
